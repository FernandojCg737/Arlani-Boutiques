@if (auth.sessionMessage(); as message) {
  <div class="session-banner">
    <span>{{ message }}</span>
    <button type="button" (click)="auth.sessionMessage.set(null)">&times;</button>
  </div>
}

@if (!hideChrome()) {
  @if (headerPlataforma()) {
    <app-header-plataforma [siempreSolido]="encabezadoSolido()" />
  } @else {
    <app-header />
  }
}

<router-outlet />

@if (!hideChrome()) {
  @if (headerPlataforma()) {
    <app-footer-plataforma />
    <!-- En la portada de Arlani, WhatsApp es para consultas sobre planes y soporte -->
    <app-whatsapp-float
      phoneNumber="59173766956"
      message="Hola, quisiera información sobre los planes de suscripción de Arlani Boutiques (o necesito ayuda de soporte)."
    />
  } @else {
    <!-- El asistente es de la tienda Atelier Aranier: no va en la portada de Arlani -->
    <app-footer />
    <app-whatsapp-float />
    <!-- El asistente conoce el catalogo de Atelier: solo en su tienda -->
    @if (auth.hasPermiso('CU19') && tiendaActiva.esOriginal()) {
      <app-chatbot-widget />
    }
  }
}

<app-login-requerido />
<!-- P4 offline: compras hechas sin conexión que esperan su pago -->
<app-aviso-compras />

@if (auth.sessionMessage(); as message) {
  <div class="session-banner">
    <span>{{ message }}</span>
    <button type="button" (click)="auth.sessionMessage.set(null)">&times;</button>
  </div>
}

@if (!hideChrome()) {
  @if (headerPlataforma()) {
    <app-header-plataforma [siempreSolido]="encabezadoSolido()" />
  } @else {
    <app-header />
  }
}

<router-outlet />

@if (!hideChrome()) {
  @if (headerPlataforma()) {
    <app-footer-plataforma />
    <!-- En la portada de Arlani, WhatsApp es para consultas sobre planes y soporte -->
    <app-whatsapp-float
      phoneNumber="59173766956"
      message="Hola, quisiera información sobre los planes de suscripción de Arlani Boutiques (o necesito ayuda de soporte)."
    />
    <!-- Portada y catálogo universal: el asistente de Arlani (todas las tiendas,
         planes y cómo crear una boutique); también para visitantes sin sesión -->
    @if (chatbotUniversal()) {
      <app-chatbot-widget [universal]="true" />
    }
  } @else {
    <app-footer />
    <app-whatsapp-float />
    <!-- Cada tienda tiene su asistente, con su modelo y sus datos -->
    @if (auth.hasPermiso('CU19')) {
      <app-chatbot-widget />
    }
  }
}

<app-login-requerido />
<!-- P4 offline: compras hechas sin conexión que esperan su pago -->
<app-aviso-compras />

@if (loginRequerido.pedido(); as pedido) {
  <div class="login-req-overlay" (click)="loginRequerido.cerrar()">
    <div
      class="login-req-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="login-req-titulo"
      (click)="$event.stopPropagation()"
    >
      <button type="button" class="login-req-cerrar" (click)="loginRequerido.cerrar()" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>

      <img class="login-req-bolsa" src="/img/arlani-icono-192.png" alt="" width="72" height="72" />

      <h2 id="login-req-titulo">Inicia sesión</h2>
      <p class="login-req-texto">Necesitas iniciar sesión {{ pedido.accion }}.</p>

      <button type="button" class="login-req-principal" (click)="ir('/login')">Iniciar sesión</button>
      <button type="button" class="login-req-secundario" (click)="ir('/registro')">Crear una cuenta</button>
      <button type="button" class="login-req-ahora-no" (click)="loginRequerido.cerrar()">Ahora no</button>
    </div>
  </div>
}
